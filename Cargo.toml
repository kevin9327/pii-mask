[workspace]
members = ["pii-core", "pii-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["PII Mask"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
toml = "0.8"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
lopdf = { version = "0.34", default-features = false }
encoding_rs = "0.8"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
js-sys = "0.3"
