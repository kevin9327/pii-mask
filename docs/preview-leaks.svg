<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="330" viewBox="0 0 1040 330" role="img">
  <rect width="1040" height="330" fill="#0e141b"/>
  <text x="36" y="38" fill="#e8eef6" font-family="sans-serif" font-size="20" font-weight="700">미리보기·문서 속성이 본문보다 먼저 샌다</text>
  <text x="36" y="62" fill="#93a0b0" font-family="sans-serif" font-size="13">탐색기 미리보기와 작성자 필드는 본문 삭제 후에도 남을 수 있습니다. 서버로는 나가지 않습니다.</text>
  <rect x="36" y="92" width="470" height="100" rx="12" fill="#151c25" stroke="#3db8a0"/>
  <text x="271" y="132" text-anchor="middle" fill="#3db8a0" font-family="sans-serif" font-size="15">HWP PrvText</text>
  <text x="271" y="158" text-anchor="middle" fill="#e8eef6" font-family="sans-serif" font-size="13">OLE 미리보기 스트림 · UTF-16</text>
  <rect x="534" y="92" width="470" height="100" rx="12" fill="#151c25" stroke="#e8b849"/>
  <text x="769" y="132" text-anchor="middle" fill="#e8b849" font-family="sans-serif" font-size="15">docProps/core.xml</text>
  <text x="769" y="158" text-anchor="middle" fill="#e8eef6" font-family="sans-serif" font-size="13">dc:description · dc:creator · 키워드</text>
  <rect x="36" y="214" width="968" height="86" rx="12" fill="#16324d" stroke="#3db8a0"/>
  <text x="520" y="252" text-anchor="middle" fill="#e8eef6" font-family="sans-serif" font-size="15">process_file이 본문과 같은 규칙으로 미리보기·속성을 스캔하고 다시 씁니다</text>
  <text x="520" y="278" text-anchor="middle" fill="#c5e8d4" font-family="sans-serif" font-size="13">HWP는 저장 시 PrvText를 마스킹된 본문으로 재생성합니다. DOCX/XLSX는 core.xml 값을 제자리 치환합니다.</text>
</svg>
