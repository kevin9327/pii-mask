<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="320" viewBox="0 0 1040 320" role="img">
  <rect width="1040" height="320" fill="#0e141b"/>
  <text x="36" y="38" fill="#e8eef6" font-family="sans-serif" font-size="20" font-weight="700">ODF도 ZIP 안 원문이다</text>
  <text x="36" y="62" fill="#93a0b0" font-family="sans-serif" font-size="13">LibreOffice ODT/ODS는 content.xml 텍스트 노드에 주민번호가 남습니다. 서버로는 나가지 않습니다.</text>
  <rect x="36" y="88" width="470" height="96" rx="12" fill="#151c25" stroke="#3db8a0"/>
  <text x="271" y="128" text-anchor="middle" fill="#3db8a0" font-family="sans-serif" font-size="15">ODT content.xml</text>
  <text x="271" y="154" text-anchor="middle" fill="#e8eef6" font-family="sans-serif" font-size="13">text:p · text:h 문단</text>
  <rect x="534" y="88" width="470" height="96" rx="12" fill="#151c25" stroke="#e8b849"/>
  <text x="769" y="128" text-anchor="middle" fill="#e8b849" font-family="sans-serif" font-size="15">ODS table:table-cell</text>
  <text x="769" y="154" text-anchor="middle" fill="#e8eef6" font-family="sans-serif" font-size="13">셀 표시 문자열</text>
  <rect x="36" y="208" width="968" height="84" rx="12" fill="#16324d" stroke="#3db8a0"/>
  <text x="520" y="246" text-anchor="middle" fill="#e8eef6" font-family="sans-serif" font-size="15">process_file이 같은 검증식으로 ODF 텍스트 노드를 스캔하고 제자리 치환합니다</text>
  <text x="520" y="272" text-anchor="middle" fill="#c5e8d4" font-family="sans-serif" font-size="13">.odt .ott .ods .ots 원 포맷 유지. META-INF/manifest.xml 로 컨테이너를 구분합니다.</text>
</svg>
