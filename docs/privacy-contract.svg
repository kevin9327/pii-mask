  <text x="894" y="154" text-anchor="middle" fill="#e8eef6" font-family="sans-serif" font-size="13">경로 없음</text>
  <rect x="36" y="214" width="968" height="96" rx="12" fill="#16324d" stroke="#3db8a0"/>
  <text x="520" y="254" text-anchor="middle" fill="#e8eef6" font-family="sans-serif" font-size="15">HWP 머리말 · XLSX 숫자 셀 · EUC-KR 본문도 같은 process_file</text>
  <text x="520" y="282" text-anchor="middle" fill="#c5e8d4" font-family="sans-serif" font-size="13">HTML 리포트는 잔여 확정 0을 엔진 값 그대로 출력합니다. 클라이언트 전용.</text>
