  <text x="186" y="154" text-anchor="middle" fill="#e8eef6" font-family="sans-serif" font-size="13">드롭 · 테이블 · 다운로드</text>
  <polygon points="346,138 376,138 376,130 400,150 376,170 376,162 346,162" fill="#3db8a0"/>
  <rect x="410" y="88" width="300" height="100" rx="12" fill="#151c25" stroke="#e8b849"/>
  <text x="560" y="128" text-anchor="middle" fill="#e8b849" font-family="sans-serif" font-size="14">Web Worker</text>
  <text x="560" y="154" text-anchor="middle" fill="#e8eef6" font-family="sans-serif" font-size="13">process_bytes · 잔여 스캔</text>
  <polygon points="720,138 750,138 750,130 774,150 750,170 750,162 720,162" fill="#3db8a0"/>
  <rect x="784" y="88" width="220" height="100" rx="12" fill="#1f3a28" stroke="#3db8a0"/>
