<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="320" viewBox="0 0 1040 320" role="img">
  <rect width="1040" height="320" fill="#0e141b"/>
  <text x="36" y="38" fill="#e8eef6" font-family="sans-serif" font-size="20" font-weight="700">표 이름과 TSV 필드도 행이 아니다</text>
  <text x="36" y="62" fill="#93a0b0" font-family="sans-serif" font-size="13">엑셀 표 displayName과 TSV 따옴표 안 줄바꿈은 셀/행 본문과 다른 축입니다. 서버로는 나가지 않습니다.</text>
  <rect x="36" y="88" width="470" height="96" rx="12" fill="#151c25" stroke="#3db8a0"/>
  <text x="271" y="128" text-anchor="middle" fill="#3db8a0" font-family="sans-serif" font-size="15">XLSX xl/tables</text>
  <text x="271" y="154" text-anchor="middle" fill="#e8eef6" font-family="sans-serif" font-size="13">displayName · tableColumn name</text>
  <rect x="534" y="88" width="470" height="96" rx="12" fill="#151c25" stroke="#e8b849"/>
  <text x="769" y="128" text-anchor="middle" fill="#e8b849" font-family="sans-serif" font-size="15">TSV quoted records</text>
  <text x="769" y="154" text-anchor="middle" fill="#e8eef6" font-family="sans-serif" font-size="13">탭 구분 · 필드 안 개행 유지</text>
  <rect x="36" y="208" width="968" height="84" rx="12" fill="#16324d" stroke="#3db8a0"/>
  <text x="520" y="246" text-anchor="middle" fill="#e8eef6" font-family="sans-serif" font-size="15">process_file이 같은 검증식으로 표 정의와 TSV 레코드를 스캔하고 다시 씁니다</text>
  <text x="520" y="272" text-anchor="middle" fill="#c5e8d4" font-family="sans-serif" font-size="13">엑셀은 table XML을 제자리 치환하고, TSV는 CSV와 같은 레코드 분할로 원 인코딩을 유지합니다.</text>
</svg>
