<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="340" viewBox="0 0 1040 340" role="img">
  <rect width="1040" height="340" fill="#0e141b"/>
  <text x="36" y="38" fill="#e8eef6" font-family="sans-serif" font-size="20" font-weight="700">화면 밖에 남는 개인정보</text>
  <text x="36" y="62" fill="#93a0b0" font-family="sans-serif" font-size="13">머리글 XObject, 엑셀 메모, PDF 주석은 인쇄 미리보기와 다른 스트림에 있습니다.</text>
  <rect x="36" y="92" width="310" height="100" rx="12" fill="#151c25" stroke="#3db8a0"/>
  <text x="191" y="132" text-anchor="middle" fill="#3db8a0" font-family="sans-serif" font-size="14">PDF Form XObject</text>
  <text x="191" y="158" text-anchor="middle" fill="#e8eef6" font-family="sans-serif" font-size="13">페이지 /XObject /Form 스트림</text>
  <rect x="366" y="92" width="310" height="100" rx="12" fill="#151c25" stroke="#3db8a0"/>
  <text x="521" y="132" text-anchor="middle" fill="#3db8a0" font-family="sans-serif" font-size="14">XLSX comments.xml</text>
  <text x="521" y="158" text-anchor="middle" fill="#e8eef6" font-family="sans-serif" font-size="13">셀 메모 · 같은 ZIP 재작성</text>
  <rect x="696" y="92" width="308" height="100" rx="12" fill="#151c25" stroke="#e8b849"/>
  <text x="850" y="132" text-anchor="middle" fill="#e8b849" font-family="sans-serif" font-size="14">PDF Annot / AcroForm</text>
  <text x="850" y="158" text-anchor="middle" fill="#e8eef6" font-family="sans-serif" font-size="13">/Contents · /V</text>
  <rect x="36" y="220" width="968" height="90" rx="12" fill="#16324d" stroke="#3db8a0"/>
  <text x="520" y="258" text-anchor="middle" fill="#e8eef6" font-family="sans-serif" font-size="15">모두 같은 process_file 탐지·잔여 스캔을 탑니다. 서버 전송 없음.</text>
  <text x="520" y="286" text-anchor="middle" fill="#c5e8d4" font-family="sans-serif" font-size="13">PDF 마스킹본은 TXT 대체. XLSX 메모는 원 ZIP 안에서 값을 가립니다.</text>
</svg>
