<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360" role="img">
  <rect width="1080" height="360" fill="#0e141b"/>
  <text x="36" y="40" fill="#e8eef6" font-family="sans-serif" font-size="20" font-weight="700">원 포맷을 유지하는 범위</text>
  <text x="36" y="64" fill="#93a0b0" font-family="sans-serif" font-size="13">오프셋 매핑이 있는 단락만 다시 씁니다. 파일이 서버로 나가지 않습니다.</text>
  <g font-family="sans-serif" font-size="13">
    <rect x="36" y="90" width="240" height="88" rx="10" fill="#151c25" stroke="#3db8a0"/>
    <text x="156" y="128" text-anchor="middle" fill="#3db8a0">HWP / HWPX / HWP3</text>
    <text x="156" y="152" text-anchor="middle" fill="#e8eef6">표 셀 · 머리말 · 본문</text>
    <rect x="292" y="90" width="240" height="88" rx="10" fill="#151c25" stroke="#3db8a0"/>
    <text x="412" y="128" text-anchor="middle" fill="#3db8a0">TXT / CSV / JSON</text>
    <text x="412" y="152" text-anchor="middle" fill="#e8eef6">UTF-16 BOM · 인용 CSV</text>
    <rect x="548" y="90" width="240" height="88" rx="10" fill="#151c25" stroke="#3db8a0"/>
    <text x="668" y="128" text-anchor="middle" fill="#3db8a0">DOCX / XLSX</text>
    <text x="668" y="152" text-anchor="middle" fill="#e8eef6">머리말 · 인덱스 제외</text>
    <rect x="804" y="90" width="240" height="88" rx="10" fill="#151c25" stroke="#e8b849"/>
    <text x="924" y="128" text-anchor="middle" fill="#e8b849">PDF 텍스트 레이어</text>
    <text x="924" y="152" text-anchor="middle" fill="#e8eef6">재작성은 TXT + 명시</text>
  </g>
  <rect x="36" y="204" width="1008" height="120" rx="12" fill="#16324d" stroke="#3db8a0"/>
  <text x="540" y="250" text-anchor="middle" fill="#e8eef6" font-family="sans-serif" font-size="16">잔여 스캔 = 마스킹본을 같은 process_file 엔진으로 다시 탐지</text>
  <text x="540" y="280" text-anchor="middle" fill="#c5e8d4" font-family="sans-serif" font-size="13">확정이 남으면 경고. 공유 문자열 인덱스·스캔 PDF·알 수 없는 ZIP은 오탐하지 않습니다.</text>
  <text x="540" y="304" text-anchor="middle" fill="#93a0b0" font-family="sans-serif" font-size="13">클라이언트 전용 · Web Worker · 서버 전송 없음</text>
</svg>
