<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="320" viewBox="0 0 1040 320" role="img">
  <rect width="1040" height="320" fill="#0e141b"/>
  <text x="36" y="38" fill="#e8eef6" font-family="sans-serif" font-size="20" font-weight="700">슬라이드 밖 글자가 먼저 샌다</text>
  <text x="36" y="62" fill="#93a0b0" font-family="sans-serif" font-size="13">발표자 노트와 엑셀 도형 상자는 화면 본문이 아니라도 파일 안에 a:t 원문이 있습니다. 서버로는 나가지 않습니다.</text>
  <rect x="36" y="88" width="470" height="96" rx="12" fill="#151c25" stroke="#3db8a0"/>
  <text x="271" y="128" text-anchor="middle" fill="#3db8a0" font-family="sans-serif" font-size="15">PPTX notesSlides</text>
  <text x="271" y="154" text-anchor="middle" fill="#e8eef6" font-family="sans-serif" font-size="13">슬라이드 a:t · 노트 a:t</text>
  <rect x="534" y="88" width="470" height="96" rx="12" fill="#151c25" stroke="#e8b849"/>
  <text x="769" y="128" text-anchor="middle" fill="#e8b849" font-family="sans-serif" font-size="15">XLSX xl/drawings</text>
  <text x="769" y="154" text-anchor="middle" fill="#e8eef6" font-family="sans-serif" font-size="13">텍스트 상자 DrawingML</text>
  <rect x="36" y="208" width="968" height="84" rx="12" fill="#16324d" stroke="#3db8a0"/>
  <text x="520" y="246" text-anchor="middle" fill="#e8eef6" font-family="sans-serif" font-size="15">process_file이 같은 검증식으로 노트·도형을 스캔하고 ZIP 안에서 제자리 치환합니다</text>
  <text x="520" y="272" text-anchor="middle" fill="#c5e8d4" font-family="sans-serif" font-size="13">.pptx .pptm .potx 와 .xlsx 도형은 원 포맷을 유지합니다. 서버 전송 없음.</text>
</svg>
