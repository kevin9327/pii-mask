<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="320" viewBox="0 0 1040 320" role="img">
  <rect width="1040" height="320" fill="#0e141b"/>
  <text x="36" y="38" fill="#e8eef6" font-family="sans-serif" font-size="20" font-weight="700">스크립트와 차트 제목도 본문이 아니다</text>
  <text x="36" y="62" fill="#93a0b0" font-family="sans-serif" font-size="13">PDF OpenAction /JS 와 엑셀 차트 a:t 는 화면 본문과 다른 축입니다. 서버로는 나가지 않습니다.</text>
  <rect x="36" y="88" width="470" height="96" rx="12" fill="#151c25" stroke="#3db8a0"/>
  <text x="271" y="128" text-anchor="middle" fill="#3db8a0" font-family="sans-serif" font-size="15">PDF OpenAction</text>
  <text x="271" y="154" text-anchor="middle" fill="#e8eef6" font-family="sans-serif" font-size="13">/S /JavaScript · /JS 문자열</text>
  <rect x="534" y="88" width="470" height="96" rx="12" fill="#151c25" stroke="#e8b849"/>
  <text x="769" y="128" text-anchor="middle" fill="#e8b849" font-family="sans-serif" font-size="15">XLSX xl/charts</text>
  <text x="769" y="154" text-anchor="middle" fill="#e8eef6" font-family="sans-serif" font-size="13">차트 제목 DrawingML a:t</text>
  <rect x="36" y="208" width="968" height="84" rx="12" fill="#16324d" stroke="#3db8a0"/>
  <text x="520" y="246" text-anchor="middle" fill="#e8eef6" font-family="sans-serif" font-size="15">process_file이 같은 검증식으로 스크립트·차트 제목을 스캔합니다. 서버 전송 없음.</text>
  <text x="520" y="272" text-anchor="middle" fill="#c5e8d4" font-family="sans-serif" font-size="13">PDF는 TXT 대체 출력에 스크립트 문자열을 포함하고, 엑셀은 chart XML을 제자리 치환합니다.</text>
</svg>
