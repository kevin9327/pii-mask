<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="330" viewBox="0 0 1040 330" role="img">
  <rect width="1040" height="330" fill="#0e141b"/>
  <text x="36" y="38" fill="#e8eef6" font-family="sans-serif" font-size="20" font-weight="700">파일 속성이 본문보다 먼저 유출된다</text>
  <text x="36" y="62" fill="#93a0b0" font-family="sans-serif" font-size="13">인쇄 머리글과 PDF Info는 미리보기 본문과 다른 사전에 있습니다. 서버로는 나가지 않습니다.</text>
  <rect x="36" y="92" width="470" height="100" rx="12" fill="#151c25" stroke="#3db8a0"/>
  <text x="271" y="132" text-anchor="middle" fill="#3db8a0" font-family="sans-serif" font-size="15">XLSX headerFooter</text>
  <text x="271" y="158" text-anchor="middle" fill="#e8eef6" font-family="sans-serif" font-size="13">oddHeader / oddFooter · 인쇄 시에만 보임</text>
  <rect x="534" y="92" width="470" height="100" rx="12" fill="#151c25" stroke="#e8b849"/>
  <text x="769" y="132" text-anchor="middle" fill="#e8b849" font-family="sans-serif" font-size="15">PDF trailer /Info</text>
  <text x="769" y="158" text-anchor="middle" fill="#e8eef6" font-family="sans-serif" font-size="13">Title Author Subject Keywords Creator</text>
  <rect x="36" y="214" width="968" height="86" rx="12" fill="#16324d" stroke="#3db8a0"/>
  <text x="520" y="252" text-anchor="middle" fill="#e8eef6" font-family="sans-serif" font-size="15">process_file이 셀·페이지 스트림과 같은 규칙으로 속성 문자열을 스캔합니다</text>
  <text x="520" y="278" text-anchor="middle" fill="#c5e8d4" font-family="sans-serif" font-size="13">XLSX는 원 시트 XML을 다시 쓰고, PDF는 TXT 대체 출력에 메타 문자열을 포함합니다.</text>
</svg>
