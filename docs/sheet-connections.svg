<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="320" viewBox="0 0 1040 320" role="img">
  <rect width="1040" height="320" fill="#0e141b"/>
  <text x="36" y="38" fill="#e8eef6" font-family="sans-serif" font-size="20" font-weight="700">탭 이름과 연결 문자열은 셀이 아니다</text>
  <text x="36" y="62" fill="#93a0b0" font-family="sans-serif" font-size="13">시트 탭과 데이터 연결 이름은 워크시트 본문이 아니라도 파일 안에 원문이 있습니다. 서버 전송 없음.</text>
  <rect x="36" y="88" width="470" height="96" rx="12" fill="#151c25" stroke="#3db8a0"/>
  <text x="271" y="128" text-anchor="middle" fill="#3db8a0" font-family="sans-serif" font-size="15">XLSX sheet name</text>
  <text x="271" y="154" text-anchor="middle" fill="#e8eef6" font-family="sans-serif" font-size="13">workbook.xml 탭 레이블</text>
  <rect x="534" y="88" width="470" height="96" rx="12" fill="#151c25" stroke="#e8b849"/>
  <text x="769" y="128" text-anchor="middle" fill="#e8b849" font-family="sans-serif" font-size="15">XLSX connections</text>
  <text x="769" y="154" text-anchor="middle" fill="#e8eef6" font-family="sans-serif" font-size="13">name · description · dbPr</text>
  <rect x="36" y="208" width="968" height="84" rx="12" fill="#16324d" stroke="#3db8a0"/>
  <text x="520" y="246" text-anchor="middle" fill="#e8eef6" font-family="sans-serif" font-size="15">process_file이 같은 검증식으로 탭·연결 이름을 스캔하고 ZIP 안에서 치환합니다</text>
  <text x="520" y="272" text-anchor="middle" fill="#c5e8d4" font-family="sans-serif" font-size="13">시트 셀은 그대로 두고, 숨은 이름만 가립니다. 서버 전송 없음.</text>
</svg>
