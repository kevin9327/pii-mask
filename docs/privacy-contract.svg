  <text x="36" y="62" fill="#93a0b0" font-family="sans-serif" font-size="13">메인 스레드는 UI. ArrayBuffer는 Worker로만 전달. fetch/upload 없음.</text>
  <rect x="36" y="88" width="300" height="100" rx="12" fill="#151c25" stroke="#3db8a0"/>
