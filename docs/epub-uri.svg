<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="320" viewBox="0 0 1040 320" role="img">
  <rect width="1040" height="320" fill="#0e141b"/>
  <text x="36" y="38" fill="#e8eef6" font-family="sans-serif" font-size="20" font-weight="700">전자책 장과 링크 주소도 본문이다</text>
  <text x="36" y="62" fill="#93a0b0" font-family="sans-serif" font-size="13">EPUB XHTML 텍스트 노드와 PDF /URI 는 화면 문단이 아니라도 파일 안에 원문이 있습니다. 서버 전송 없음.</text>
  <rect x="36" y="88" width="470" height="96" rx="12" fill="#151c25" stroke="#3db8a0"/>
  <text x="271" y="128" text-anchor="middle" fill="#3db8a0" font-family="sans-serif" font-size="15">EPUB OEBPS/*.xhtml</text>
  <text x="271" y="154" text-anchor="middle" fill="#e8eef6" font-family="sans-serif" font-size="13">container.xml · 텍스트 노드</text>
  <rect x="534" y="88" width="470" height="96" rx="12" fill="#151c25" stroke="#e8b849"/>
  <text x="769" y="128" text-anchor="middle" fill="#e8b849" font-family="sans-serif" font-size="15">PDF Annot /URI</text>
  <text x="769" y="154" text-anchor="middle" fill="#e8eef6" font-family="sans-serif" font-size="13">링크 액션 주소 문자열</text>
  <rect x="36" y="208" width="968" height="84" rx="12" fill="#16324d" stroke="#3db8a0"/>
  <text x="520" y="246" text-anchor="middle" fill="#e8eef6" font-family="sans-serif" font-size="15">process_file이 같은 검증식으로 장·URI를 스캔합니다. 서버 전송 없음.</text>
  <text x="520" y="272" text-anchor="middle" fill="#c5e8d4" font-family="sans-serif" font-size="13">EPUB은 ZIP 안 XHTML을 제자리 치환하고, PDF는 TXT 대체 출력에 URI를 포함합니다.</text>
</svg>
