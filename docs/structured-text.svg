<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="320" viewBox="0 0 1040 320" role="img">
  <rect width="1040" height="320" fill="#0e141b"/>
  <text x="36" y="38" fill="#e8eef6" font-family="sans-serif" font-size="20" font-weight="700">줄바꿈이 필드 안이면 행이 아닙니다</text>
  <text x="36" y="62" fill="#93a0b0" font-family="sans-serif" font-size="13">RFC 4180 따옴표 필드와 DOCX customXml은 본문 문단과 다른 축입니다. 서버로는 나가지 않습니다.</text>
  <rect x="36" y="88" width="470" height="96" rx="12" fill="#151c25" stroke="#3db8a0"/>
  <text x="271" y="128" text-anchor="middle" fill="#3db8a0" font-family="sans-serif" font-size="15">CSV quoted records</text>
  <text x="271" y="154" text-anchor="middle" fill="#e8eef6" font-family="sans-serif" font-size="13">필드 안 개행은 한 행 · 따옴표 유지</text>
  <rect x="534" y="88" width="470" height="96" rx="12" fill="#151c25" stroke="#e8b849"/>
  <text x="769" y="128" text-anchor="middle" fill="#e8b849" font-family="sans-serif" font-size="15">customXml/item1.xml</text>
  <text x="769" y="154" text-anchor="middle" fill="#e8eef6" font-family="sans-serif" font-size="13">콘텐츠 컨트롤 바인딩 원문</text>
  <rect x="36" y="208" width="968" height="84" rx="12" fill="#16324d" stroke="#3db8a0"/>
  <text x="520" y="246" text-anchor="middle" fill="#e8eef6" font-family="sans-serif" font-size="15">process_file이 레코드·XML 텍스트 노드를 같은 검증식으로 스캔하고 다시 씁니다</text>
  <text x="520" y="272" text-anchor="middle" fill="#c5e8d4" font-family="sans-serif" font-size="13">CSV는 원 인코딩으로, DOCX는 ZIP 안 customXml을 제자리 치환합니다.</text>
</svg>
